<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPME – Rapport d'expertise</title>
<style>
  :root {
    --navy: #1B3A6B;
    --steel: #4A6FA5;
    --lblue: #E8EEF6;
    --lgray: #D6DCE4;
    --dgray: #6B7280;
    --silvr: #F2F4F7;
    --white: #ffffff;
    --black: #1F2937;
    --accent: #3B82F6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--silvr); color: var(--black); font-size: 14px; }

  /* ── HEADER APP ── */
  .app-header {
    background: var(--navy);
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 12px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    max-height: 52px;
  }
  .app-header img { height: 38px !important; max-height: 38px !important; }
  .app-header h1 { font-size: 16px; font-weight: 600; letter-spacing: 0.5px; }
  .app-header .subtitle { font-size: 11px; color: #8AAED4; margin-top: 2px; }
  .btn-export {
    background: var(--steel);
    color: white;
    border: none;
    padding: 5px 12px;
    border-radius: 5px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.2s;
  }
  .btn-export:hover { background: #3a5a8a; }
  .btn-export svg { width: 16px; height: 16px; }

  /* ── NAV SECTIONS ── */
  .nav-sections {
    background: white;
    border-right: 2px solid var(--lgray);
    display: flex;
    flex-direction: column;
    width: 210px;
    flex-shrink: 0;
    position: sticky;
    top: 52px;
    height: calc(100vh - 52px);
    overflow-y: auto;
    padding: 8px 0;
    gap: 0;
  }
  .nav-btn {
    padding: 10px 16px;
    border: none;
    background: none;
    font-size: 13px;
    color: var(--dgray);
    cursor: pointer;
    border-left: 3px solid transparent;
    white-space: nowrap;
    transition: all 0.15s;
    font-weight: 500;
    text-align: left;
  }
  .nav-btn:hover { color: var(--navy); background: var(--lblue); }
  .nav-btn.active { color: var(--navy); border-left-color: var(--navy); font-weight: 700; background: var(--lblue); }
  @media print {
.nav-sections { display: none !important; }
.actor-del-btn { display: none !important; }
.photo-legend.legend-empty { display: none !important; }
    .photo-legend {
    width: 100%;
    font-size: 9px;
    color: #777;
    font-style: italic;
    border: none;
    padding: 0;
    background: transparent;
    resize: none;
    box-sizing: border-box;
    min-height: 0;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .photo-legend:not(:placeholder-shown) {
    padding: 3px 4px;
    border-top: 1px solid #e5e7eb;
  }
.app-header, .nav-sections, .btn-add-bloc, .btn-add-photo,
    .btn-delete-bloc, .btn-export, .photo-delete, .actor-del-btn, .reunion-del-btn, .reunion-facultatif-badge { display: none !important; }
    .actor-table td:nth-child(5), .actor-table th:nth-child(5) { display: none !important; }
    .actor-table { width: 100% !important; table-layout: fixed !important; border-collapse: collapse !important; }
    .actor-table th:nth-child(1), .actor-table td:nth-child(1) { width: 22% !important; }
    .actor-table th:nth-child(2), .actor-table td:nth-child(2) { width: 26% !important; }
    .actor-table th:nth-child(3), .actor-table td:nth-child(3) { width: 12% !important; }

  /* ── MAIN LAYOUT ── */
  .main { flex: 1; min-width: 0; padding: 24px 16px 60px; }

  /* ── SECTION CARD ── */

  /* ── CHAMPS ── */

    width: 100%;

    padding: 8px 12px;

    color: var(--black);

    resize: none;
  }
  input[type=text]:focus, input[type=date]:focus, textarea:focus, select:focus {
    outline: none;

  textarea { min-height: 0; overflow: hidden; }

  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

  /* ── TABLE ACTEURS ── */
  .actor-table { width: 100%; border-collapse: collapse; table-layout: fixed; }

    background: var(--navy);

  .actor-del-btn { background: none; border: none; color: #EF4444; font-size: 18px; cursor: pointer; padding: 4px 8px; border-radius: 4px; line-height: 1; }
  .actor-del-btn:hover { background: #FEE2E2; }
  
  .actor-textarea { resize: none; min-height: 52px; line-height: 1.5; overflow: hidden; }
  .actor-table input:focus { outline: 2px solid var(--steel); border-radius: 3px; }

  /* ── Cartes acteurs ── */
  .actor-cards-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .actor-card { background: #F4F5F7; border-radius: 10px; padding: 14px; position: relative; }

  .actor-card-actions { display: flex; gap: 6px; }

  @media print {

  .btn-add-photo {

    top: 30px; left: 30px;

function b64ToBytes(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return bytes;
}

async function deriveKey(password, saltBytes, iterations){
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey('raw', enc.encode(password), {name:'PBKDF2'}, false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt: saltBytes, iterations: iterations, hash:'SHA-256'},
    baseKey,
    {name:'AES-GCM', length:256},
    false,
    ['decrypt']
  );
}

  const pwd = document.getElementById('pwd-input').value;
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('unlock-btn');
  errEl.textContent = '';
  if(!pwd){ errEl.textContent='Mot de passe requis.'; return; }
  btn.disabled = true; btn.textContent = 'V\u00e9rification\u2026';
  try{
    const saltBytes = b64ToBytes(ENC_SALT);
    const ivBytes = b64ToBytes(ENC_IV);
    const dataBytes = b64ToBytes(ENC_DATA);
    const key = await deriveKey(pwd, saltBytes, ENC_ITER);
    const decrypted = await crypto.subtle.decrypt({name:'AES-GCM', iv: ivBytes}, key, dataBytes);
    const html = new TextDecoder().decode(decrypted);

    document.getElementById('app-root').innerHTML = html;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app-root').style.display = 'block';
    try { sessionStorage.setItem('epme_pwd', pwd); } catch(e) {}

    const scripts = document.getElementById('app-root').querySelectorAll('script');
    scripts.forEach(oldScript => {
      const newScript = document.createElement('script');
      newScript.textContent = oldScript.textContent;
      oldScript.parentNode.replaceChild(newScript, oldScript);
    });
  }catch(e){
    errEl.textContent = 'Mot de passe incorrect.';
    btn.disabled = false; btn.textContent = 'D\u00e9verrouiller';
  }
}

document.getElementById('pwd-input').addEventListener('keydown', e=>{ if(e.key==='Enter') tryUnlock(); });

// Auto-déverrouillage si un mot de passe est déjà en session (venant du TDB ou d'un autre fichier EPME)
(function autoUnlock(){
  let saved;
  try { saved = sessionStorage.getItem('epme_pwd'); } catch(e) { saved = null; }
  if (saved) {
    document.getElementById('pwd-input').value = saved;
    tryUnlock();
  }
})();
</script>
