<!DOCTYPE html>
<!-- EPME PV d'expertise - v6 (verrou mot de passe) -->
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPME – Rapport d'expertise</title>
<style>
  :root {
    --navy: #1B3A6B;
    --steel: #4A6FA5;
    --lblue: #E8EEF6;
    --lgray: #D6DCE4;
    --dgray: #6B7280;
    --silvr: #F2F4F7;
    --white: #ffffff;
    --black: #1F2937;
    --accent: #3B82F6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--silvr); color: var(--black); font-size: 14px; }

  /* ── HEADER APP ── */
  .app-header {
    background: var(--navy);
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .app-header img { height: 38px; }
  .app-header h1 { font-size: 16px; font-weight: 600; letter-spacing: 0.5px; }
  .app-header .subtitle { font-size: 11px; color: #8AAED4; margin-top: 2px; }
  .btn-export {
    background: var(--steel);
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.2s;
  }
  .btn-export:hover { background: #3a5a8a; }
  .btn-export svg { width: 16px; height: 16px; }

  /* ── NAV SECTIONS ── */
  .nav-sections {
    background: white;
    border-right: 2px solid var(--lgray);
    display: flex;
    flex-direction: column;
    width: 180px;
    flex-shrink: 0;
    position: sticky;
    top: 64px;
    height: calc(100vh - 64px);
    overflow-y: auto;
    padding: 8px 0;
    gap: 0;
  }
  .nav-btn {
    padding: 10px 16px;
    border: none;
    background: none;
    font-size: 12px;
    color: var(--dgray);
    cursor: pointer;
    border-left: 3px solid transparent;
    white-space: nowrap;
    transition: all 0.15s;
    font-weight: 500;
    text-align: left;
  }
  .nav-btn:hover { color: var(--navy); background: var(--lblue); }
  .nav-btn.active { color: var(--navy); border-left-color: var(--navy); font-weight: 700; background: var(--lblue); }
  @media print { .nav-sections { display: none !important; } }
  @media print {
    input[type="date"]::-webkit-calendar-picker-indicator { display: none !important; }
    input[type="date"] { -moz-appearance: textfield; }
  }

  /* ── MAIN LAYOUT ── */
  .main { flex: 1; min-width: 0; padding: 24px 16px 60px; }
  .layout-wrapper { display: flex; align-items: flex-start; }

  /* ── SECTION CARD ── */
  .section-card {
    background: white;
    border-radius: 8px;
    margin-bottom: 20px;
    border: 1px solid var(--lgray);
    overflow: hidden;
    display: none;
  }
  .section-card.active { display: block; }

  .section-header {
    background: var(--navy);
    color: white;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .section-num {
    font-size: 22px;
    font-weight: 800;
    color: rgba(255,255,255,0.2);
    line-height: 1;
    min-width: 32px;
  }
  .section-title-text { font-size: 15px; font-weight: 700; letter-spacing: 0.3px; }

  .section-body { padding: 20px; }

  /* ── CHAMPS ── */
  .field-group { margin-bottom: 16px; }
  .field-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--steel);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 5px;
  }
  input[type=text], input[type=date], textarea, select {
    width: 100%;
    border: 1.5px solid var(--lgray);
    border-radius: 5px;
    padding: 8px 12px;
    font-size: 13px;
    font-family: inherit;
    color: var(--black);
    background: white;
    transition: border-color 0.15s;
    resize: none;
  }
  input[type=text]:focus, input[type=date]:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--steel);
    box-shadow: 0 0 0 3px rgba(74,111,165,0.12);
  }
  textarea { min-height: 0; overflow: hidden; }

  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

  /* ── TABLE ACTEURS ── */
  .actor-table { width: 100%; border-collapse: collapse; }
  .actor-table th {
    background: var(--navy);
    color: white;
    font-size: 11px;
    font-weight: 700;
    padding: 10px 12px;
    text-align: left;
  }
  .actor-table td { padding: 4px; border: 1px solid var(--lgray); }
  .actor-table tr:nth-child(even) td { background: var(--lblue); }
  .actor-table input, .actor-table textarea { border: none; background: transparent; padding: 6px 8px; font-size: 13px; width: 100%; font-family: inherit; }
  .actor-textarea { resize: none; min-height: 52px; line-height: 1.5; overflow: hidden; }
  .actor-table input:focus { outline: 2px solid var(--steel); border-radius: 3px; }

  /* ── Cartes acteurs ── */
  .actor-cards-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .actor-card { background: #F4F5F7; border-radius: 10px; padding: 14px; position: relative; }
  .actor-card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
  .actor-card-badge { display: inline-block; background: #E2E6EE; color: var(--ink); font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px; text-transform: uppercase; letter-spacing: .3px; }
  .actor-card-actions { display: flex; gap: 6px; }
  .actor-card-actions button { border: none; background: none; cursor: pointer; font-size: 15px; color: var(--dgray); padding: 2px; line-height: 1; }
  .actor-card-actions button:hover { color: var(--steel); }
  .actor-card-name { font-weight: 700; font-size: 14px; color: var(--ink); margin-bottom: 6px; text-transform: uppercase; }
  .actor-card-info { font-size: 12.5px; color: var(--dgray); line-height: 1.55; white-space: pre-line; word-break: break-word; margin-bottom: 10px; }
  .actor-card-toggle { display: flex; border-radius: 7px; overflow: hidden; border: 1px solid #D7DAE0; }
  .actor-card-toggle button { flex: 1; border: none; padding: 7px 0; font-size: 12.5px; font-weight: 600; cursor: pointer; background: #fff; color: var(--dgray); }
  .actor-card-toggle button.active.absent { background: #E8742C; color: #fff; }
  .actor-card-toggle button.active.present { background: var(--steel); color: #fff; }

  /* ── Carte en mode édition ── */
  .actor-card.editing .actor-card-edit { display: block; }
  .actor-card.editing .actor-card-view { display: none; }
  .actor-card-edit { display: none; }
  .actor-card-edit .field-group { margin-bottom: 8px; }
  .actor-card-edit label { font-size: 11px; font-weight: 600; color: var(--dgray); display: block; margin-bottom: 3px; }
  .actor-card-edit input, .actor-card-edit select, .actor-card-edit textarea {
    width: 100%; border: 1px solid #D7DAE0; border-radius: 6px; padding: 6px 8px; font-size: 12.5px; font-family: inherit; background: #fff;
  }
  .actor-card-edit textarea { resize: vertical; min-height: 50px; }
  .actor-card-edit-done { width: 100%; margin-top: 4px; border: none; background: var(--steel); color: #fff; padding: 7px 0; border-radius: 6px; font-size: 12.5px; font-weight: 600; cursor: pointer; }

  @media print {
    .actor-cards-container, .actor-card-toggle, .actor-card-actions { display: none !important; }
    .actor-print-table { display: table !important; width: 100%; border-collapse: collapse; }
    .actor-print-table th { background: #1B3A6B !important; color: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; padding: 6px 8px; font-size: 12px; text-align: left; }
    .actor-print-table td { border: 1px solid var(--lgray); padding: 6px 8px; font-size: 12.5px; white-space: normal; word-break: break-word; vertical-align: top; }
    .actor-print-table tr:nth-child(even) td { background: var(--lblue); }
  }
  .actor-action-col { text-align: center; padding: 4px !important; }
  .actor-present-col { text-align: center; padding: 4px !important; }
  .actor-present-col input[type=checkbox] { width: 16px; height: 16px; cursor: pointer; }
  .btn-remove-actor { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--lgray); background: #fff; color: var(--dgray); font-size: 14px; line-height: 1; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  .btn-remove-actor:hover { background: #FCEBEB; color: #A32D2D; border-color: #A32D2D; }
  @media print { .no-print, .actor-action-col, .actor-present-col { display: none !important; } }

  /* ── BLOCS DYNAMIQUES ── */
  .bloc-container { display: flex; flex-direction: column; gap: 12px; margin-bottom: 8px; }

  .bloc {
    border: 1.5px solid var(--lgray);
    border-radius: 6px;
    overflow: hidden;
    background: var(--silvr);
  }
  .bloc-header {
    background: var(--lblue);
    border-bottom: 1px solid var(--lgray);
    padding: 8px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .bloc-header input {
    border: none;
    background: transparent;
    font-size: 13px;
    font-weight: 600;
    color: var(--navy);
    flex: 1;
    padding: 2px 4px;
  }
  .bloc-header input:focus { outline: 1px solid var(--steel); border-radius: 3px; }
  .bloc-header input::placeholder { color: var(--dgray); font-weight: 400; }
  .bloc-body { padding: 12px; display: flex; flex-direction: column; gap: 10px; }

  .bloc textarea {
    min-height: 0 !important;
    font-size: 13px;
    overflow: hidden !important;
  }

  /* Zone photos */
  .photos-zone {
    border: 2px dashed var(--lgray);
    border-radius: 6px;
    padding: 12px;
    background: white;
  }
  .photos-zone-label {
    font-size: 11px;
    color: var(--dgray);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-bottom: 8px;
  }
  .photos-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 8px;
    justify-items: center;
  }
  .photo-thumb {
    position: relative;
    width: 100%;
    height: 180px;
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid var(--lgray);
  }
  .photo-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .photo-thumb .photo-delete {
    position: absolute;
    top: 2px; right: 2px;
    background: rgba(0,0,0,0.6);
    color: white;
    border: none;
    border-radius: 50%;
    width: 18px; height: 18px;
    font-size: 11px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
  }
  .photo-caption {
    font-size: 10px;
    color: var(--dgray);
    text-align: center;
    padding: 2px 4px;
    background: rgba(0,0,0,0.04);
    border-top: 1px solid var(--lgray);
  }
  .btn-add-photo {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border: 1.5px solid var(--steel);
    border-radius: 5px;
    background: white;
    color: var(--steel);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-add-photo:hover { background: var(--lblue); }
  .btn-add-photo input[type=file] { display: none; }

  /* Bouton supprimer bloc */
  .btn-delete-bloc {
    background: none;
    border: none;
    color: #EF4444;
    cursor: pointer;
    font-size: 16px;
    padding: 2px 6px;
    border-radius: 4px;
    transition: background 0.15s;
    line-height: 1;
  }
  .btn-delete-bloc:hover { background: #FEE2E2; }

  /* Bouton ajouter bloc */
  .btn-add-bloc {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 10px;
    border: 2px dashed var(--steel);
    border-radius: 6px;
    background: none;
    color: var(--steel);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    margin-top: 4px;
  }
  .btn-add-bloc:hover { background: var(--lblue); border-color: var(--navy); color: var(--navy); }
  .btn-add-bloc .plus { font-size: 20px; font-weight: 300; line-height: 1; }

  /* ── SOUS-SECTIONS CONSTATATIONS ── */
  .subsection { margin-bottom: 20px; }
  .subsection-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--steel);
    padding: 8px 0 8px 12px;
    border-left: 4px solid var(--steel);
    margin-bottom: 10px;
  }

  /* ── VÉHICULE TABLE ── */
  .vehicle-table { width: 100%; border-collapse: collapse; }
  .vehicle-table td { padding: 0; border: 1px solid var(--lgray); }
  .vehicle-table .vt-label {
    background: var(--lblue);
    padding: 8px 12px;
    font-size: 12px;
    font-weight: 700;
    color: var(--navy);
    width: 38%;
  }
  .vehicle-table .vt-val input {
    border: none;
    padding: 8px 12px;
    font-size: 13px;
    width: 100%;
    background: white;
  }
  .vehicle-table .vt-val input:focus { outline: 2px solid var(--steel); }
  .vehicle-table tr:nth-child(even) .vt-val { background: var(--silvr); }

  /* ── SIGNATURE ── */
  .signature-block {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-top: 16px;
  }
  .sig-box {
    border: 1.5px solid var(--lgray);
    border-radius: 6px;
    padding: 16px;
    min-height: 0;
    background: var(--silvr);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }
  .sig-name { font-weight: 700; color: var(--navy); font-size: 13px; }
  .sig-title { font-size: 11px; color: var(--dgray); margin-top: 4px; }

  /* ── PRINT ── */
  @media print {
    .app-header, .nav-sections, .btn-add-bloc, .btn-add-photo,
    .btn-delete-bloc, .btn-export, .photo-delete { display: none !important; }
    body { background: white; font-size: 11pt; }
    .main { max-width: 100%; padding: 0; }
    .section-card { display: block !important; border: none; margin-bottom: 16px; page-break-inside: avoid; }
    .section-card:first-child { page-break-after: always; }
    .section-header { background: #1B3A6B !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .actor-table th { background: #1B3A6B !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .vehicle-table .vt-label { background: #E8EEF6 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .bloc-header { background: #E8EEF6 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .subsection-title { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .bloc { break-inside: avoid; page-break-inside: avoid; }
    .photos-grid { display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 10px !important; justify-items: center !important; }
    .photos-zone { display: block !important; border: none !important; padding: 0 !important; }
    .photo-thumb { width: 100% !important; height: 180px !important; display: block !important; overflow: hidden !important; break-inside: avoid !important; }
    .photo-thumb img {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      display: block !important;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
      color-adjust: exact !important;
      visibility: visible !important;
      opacity: 1 !important;
    }
    img { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    .photo-caption { font-size: 9pt !important; display: block !important; }
    .photos-zone.no-photos { display: none !important; }
    input, textarea {
      border: none !important;
      box-shadow: none !important;
      resize: none !important;
      overflow: visible !important;
    }
    textarea {
      height: auto !important;
      min-height: 0 !important;
      max-height: none !important;
      overflow: visible !important;
      white-space: pre-wrap !important;
      word-break: break-word !important;
      display: block !important;
    }
    .bloc-title-empty { display: none !important; }
  }

  /* ── MODAL KDRIVE ── */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }
  .modal-box {
    background: white;
    border-radius: 12px;
    padding: 28px;
    width: 420px;
    max-width: 95vw;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .modal-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .modal-field { margin-bottom: 14px; }
  .modal-label { font-size: 11px; font-weight: 700; color: var(--steel); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
  .modal-hint { font-size: 11px; color: var(--dgray); margin-top: 4px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .modal-btn {
    flex: 1; padding: 10px; border: none; border-radius: 6px;
    font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.15s;
  }
  .modal-btn-primary { background: var(--navy); color: white; }
  .modal-btn-primary:hover { background: var(--steel); }
  .modal-btn-secondary { background: var(--lgray); color: var(--black); }
  .modal-btn-secondary:hover { background: #c0c8d4; }
  .modal-error { color: #EF4444; font-size: 12px; margin-top: 8px; min-height: 16px; }
  .modal-select { width: 100%; padding: 8px 10px; border: 1.5px solid var(--lgray); border-radius: 5px; font-size: 13px; margin-top: 4px; }

  /* ══ PAGE DE GARDE ══════════════════════════════════════════════════════ */
  .cover-preview {
    position: relative;
    background: #ffffff;
    min-height: 720px;
    padding: 50px 56px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  /* Éléments géométriques */
  .cover-geo {
    position: absolute;
    pointer-events: none;
  }
  /* Grand carré navy coin supérieur droit */
  .cover-geo-1 {
    top: -60px; right: -60px;
    width: 200px; height: 200px;
    background: var(--navy);
    transform: rotate(15deg);
    opacity: 0.08;
  }
  /* Rectangle acier oblique bas gauche */
  .cover-geo-2 {
    bottom: -40px; left: -30px;
    width: 260px; height: 120px;
    background: var(--steel);
    transform: rotate(-8deg);
    opacity: 0.07;
  }
  /* Petit carré acier coin supérieur gauche */
  .cover-geo-3 {
    top: 30px; left: 30px;
    width: 40px; height: 40px;
    border: 3px solid var(--navy);
    opacity: 0.15;
    transform: rotate(20deg);
  }
  /* Cercle fantôme bas droit */
  .cover-geo-4 {
    bottom: 60px; right: 50px;
    width: 120px; height: 120px;
    border-radius: 50%;
    border: 2px solid var(--steel);
    opacity: 0.1;
  }

  .cover-content { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 20px; max-width: 700px; margin: 0 auto; width: 100%; page-break-inside: avoid; break-inside: avoid; }

  /* Logo + cabinet */
  .cover-top { display: flex; align-items: center; gap: 20px; }
  .cover-logo { height: 96px; width: auto; }
  .cover-cabinet { border-left: 3px solid var(--navy); padding-left: 18px; }
  .cover-cabinet-name { font-size: 30px; font-weight: 800; color: var(--navy); letter-spacing: 2px; line-height: 1.1; }
  .cover-cabinet-sub { font-size: 12px; color: var(--dgray); margin-top: 4px; letter-spacing: 0.5px; }
  .cover-cabinet-tagline { font-size: 11px; color: var(--steel); margin-top: 3px; font-style: italic; }

  /* Séparateur géométrique */
  .cover-separator { display: flex; align-items: center; gap: 12px; }
  .cover-sep-line { flex: 1; height: 1.5px; background: linear-gradient(to right, var(--lgray), var(--navy), var(--lgray)); }
  .cover-sep-diamond {
    width: 10px; height: 10px;
    background: var(--navy);
    transform: rotate(45deg);
    flex-shrink: 0;
  }

  /* Titre */
  .cover-title-block { text-align: center; padding: 8px 0; }
  .cover-label {
    font-size: 28px; font-weight: 800;
    color: var(--navy);
    letter-spacing: 4px;
    line-height: 1.1;
  }
  .cover-subtitle { font-size: 13px; color: var(--steel); margin-top: 8px; font-style: italic; letter-spacing: 0.5px; }

  /* Champs */
  .cover-fields {
    background: var(--silvr);
    border: 1.5px solid var(--lgray);
    border-left: 4px solid var(--navy);
    border-radius: 0 6px 6px 0;
    padding: 20px 24px;
  }
  .cover-field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .cover-field { display: flex; flex-direction: column; gap: 5px; }
  .cover-field-label { font-size: 10px; font-weight: 700; color: var(--steel); text-transform: uppercase; letter-spacing: 0.8px; }
  .cover-input {
    border: none;
    border-bottom: 1.5px solid var(--lgray);
    background: transparent;
    padding: 6px 4px;
    font-size: 14px;
    color: var(--black);
    font-family: inherit;
    border-radius: 0;
    transition: border-color 0.15s;
  }
  .cover-input:focus { outline: none; border-bottom-color: var(--navy); }

  /* Coordonnées */

    border-top: 1px solid var(--lgray);
    padding-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .cover-coord-line { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--dgray); }
  .cover-coord-icon { color: var(--navy); font-size: 7px; flex-shrink: 0; }

  /* Réseaux sociaux */
  .cover-social {
    display: flex;
    gap: 16px;
    align-items: center;
    padding-top: 16px;
    border-top: 1px solid var(--lgray);
    page-break-inside: avoid;
    break-inside: avoid;
  }
  .cover-content { page-break-inside: avoid; break-inside: avoid; }
  .cover-social-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px; height: 38px;
    border: 1.5px solid var(--lgray);
    border-radius: 8px;
    background: white;
    transition: all 0.15s;
    text-decoration: none;
  }
  .cover-social-icon:hover {
    border-color: var(--navy);
    background: var(--lblue);
    transform: translateY(-2px);
  }

  /* ── PRINT cover ── */
  @media print {
    #sec-0 .section-header { display: none !important; }
    .cover-preview { min-height: 100vh; padding: 60px 70px; page-break-after: always; justify-content: center; }
    .cover-geo-1 { opacity: 0.06 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .cover-geo-2 { opacity: 0.05 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .cover-label { font-size: 32px !important; }
    .cover-fields { background: #F2F4F7 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .cover-sep-diamond { background: #1B3A6B !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .cover-cabinet { border-left-color: #1B3A6B !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .cover-social-icon { border-color: #D6DCE4 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .cover-social-icon svg { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }

  /* ── ASTUCE IMPRESSION ── */
  .print-tip {
    background: #FEF3C7;
    border-bottom: 2px solid #F59E0B;
    padding: 0;
  }
  .print-tip-content {
    max-width: 900px;
    margin: 0 auto;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12.5px;
    color: #92400E;
  }
  .print-tip-icon { font-size: 16px; flex-shrink: 0; }
  .print-tip-content strong { color: #78350F; }
  .print-tip-close {
    margin-left: auto;
    background: none;
    border: none;
    font-size: 18px;
    color: #92400E;
    cursor: pointer;
    padding: 0 4px;
    line-height: 1;
    flex-shrink: 0;
  }
  .print-tip-close:hover { color: #78350F; }
  @media print { .print-tip { display: none !important; } }

  /* ══ TABLEAU ÉVALUATION ══ */
  .eval-table-wrap { overflow-x:auto; border-radius:6px; border:1.5px solid var(--lgray); }
  .eval-table { width:100%; border-collapse:collapse; min-width:580px; }
  .eval-th { background:var(--navy); color:white; font-size:11px; font-weight:700; padding:10px 8px; text-align:center; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .eval-col-qty  { width:7%; }
  .eval-col-desc { width:40%; text-align:left; padding-left:12px; }
  .eval-col-pu   { width:15%; }
  .eval-col-ht   { width:15%; }
  .eval-col-ttc  { width:15%; }
  .eval-col-del  { width:8%; }
  .eval-table tbody tr { border-bottom:1px solid var(--lgray); }
  .eval-table tbody tr:nth-child(even) td { background:var(--silvr); -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .eval-td { padding:2px 4px; vertical-align:middle; }
  .eval-input { width:100%; border:none; background:transparent; padding:7px 6px; font-size:13px; font-family:inherit; text-align:right; color:var(--black); }
  .eval-input:focus { outline:1px solid var(--steel); border-radius:3px; background:white; }
  .eval-input-desc { text-align:left; }
  .eval-input-qty  { text-align:center; }
  .eval-computed { padding:7px 8px; font-size:13px; color:var(--navy); font-weight:600; text-align:right; display:block; }
  .eval-row-del { background:none; border:none; color:#EF4444; cursor:pointer; font-size:16px; padding:4px 8px; border-radius:4px; line-height:1; }
  .eval-row-del:hover { background:#FEE2E2; }
  .eval-total-row td { background:var(--navy) !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .eval-total-label { padding:10px 12px; font-size:12px; font-weight:700; color:white; letter-spacing:1px; text-align:right; }
  .eval-total-ht, .eval-total-ttc { padding:10px 8px; font-size:14px; font-weight:800; color:white; text-align:right; }
  @media print {

    .eval-facultatif { display:none !important; }

  /* ══ PRÉAMBULE ══ */
  .preambule-box {
    display: flex;
    gap: 16px;
    background: #FFF8E7;
    border: 1.5px solid #F59E0B;
    border-left: 5px solid #F59E0B;

    margin-top: 8px;

    border-radius: 8px;

  .sig-card-role { font-size: 11px; color: var(--dgray); margin-top: 2px; }
  .sig-canvas-wrap { background: white; padding: 8px; position: relative; }
  canvas.sig-canvas {
    display: block;
    width: 100%;
    height: 120px;
    cursor: crosshair;
    border: 1px dashed var(--lgray);
    border-radius: 4px;
    touch-action: none;
  }
  .sig-actions {
    display: flex;
    gap: 8px;
    padding: 8px 14px;
    background: var(--silvr);
    border-top: 1px solid var(--lgray);
  }
  .sig-btn {
    font-size: 11px;
    padding: 4px 10px;
    border: 1.5px solid var(--lgray);
    border-radius: 4px;
    background: white;
    cursor: pointer;
    color: var(--dgray);
    font-family: inherit;
  }
  .sig-btn:hover { background: var(--lblue); border-color: var(--steel); color: var(--navy); }
  .sig-btn-clear { color: #EF4444; }
  .sig-btn-clear:hover { background: #FEE2E2; border-color: #EF4444; }
  @media print {
    .sig-actions { display: none !important; }
    canvas.sig-canvas { border: 1px solid var(--lgray) !important; height: 100px !important; }
    .sig-card { break-inside: avoid; }
  }

  /* ── DRAG & DROP ── */
  .drag-handle {
    cursor: grab;
    font-size: 16px;
    color: var(--lgray);
    padding: 0 6px;
    flex-shrink: 0;
    user-select: none;
    letter-spacing: -1px;
  }
  .drag-handle:active { cursor: grabbing; }
  .bloc-sortable { transition: opacity 0.15s; }
  .bloc-sortable.dragging { opacity: 0.4; }
  .bloc-sortable.drag-over { border-color: var(--navy); box-shadow: 0 0 0 2px rgba(27,58,107,0.3); }
  @media print { .drag-handle { display: none !important; } }

  /* Force auto-height on ALL textareas */
  textarea {
    min-height: 0 !important;
    overflow: hidden !important;
    resize: none !important;
    height: auto;
  }

  /* Remplacement textareas à l'impression */
  .print-textarea-replacement {
    display: none;
    font-family: inherit;
    font-size: 13px;

  body.printing textarea { display: none !important; }
  body.printing .print-textarea-replacement { display: block !important; }
  body.printing .photo-thumb { display: inline-block !important; }
  body.printing .photo-thumb img { display: block !important; }
  body.printing .photos-grid { display: grid !important; grid-template-columns: 1fr 1fr !important; justify-items: center !important; }
  body.printing .photos-zone:not(.no-photos) { display: block !important; }
  @media print {
    textarea { display: none !important; }
    .print-textarea-replacement { display: block !important; }
  }
</style>

function b64ToBytes(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return bytes;
}

async function deriveKey(password, saltBytes, iterations){
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey('raw', enc.encode(password), {name:'PBKDF2'}, false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt: saltBytes, iterations: iterations, hash:'SHA-256'},
    baseKey,
    {name:'AES-GCM', length:256},
    false,
    ['decrypt']
  );
}

async function tryUnlock(){
  const pwd = document.getElementById('pwd-input').value;
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('unlock-btn');
  errEl.textContent = '';
  if(!pwd){ errEl.textContent='Mot de passe requis.'; return; }
  btn.disabled = true; btn.textContent = 'V\u00e9rification\u2026';
  try{
    const saltBytes = b64ToBytes(ENC_SALT);
    const ivBytes = b64ToBytes(ENC_IV);
    const dataBytes = b64ToBytes(ENC_DATA);
    const key = await deriveKey(pwd, saltBytes, ENC_ITER);
    const decrypted = await crypto.subtle.decrypt({name:'AES-GCM', iv: ivBytes}, key, dataBytes);
    const html = new TextDecoder().decode(decrypted);

    document.getElementById('app-root').innerHTML = html;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app-root').style.display = 'block';
    try { sessionStorage.setItem('epme_pwd', pwd); } catch(e) {}

    const scripts = document.getElementById('app-root').querySelectorAll('script');
    scripts.forEach(oldScript => {
      const newScript = document.createElement('script');
      newScript.textContent = oldScript.textContent;
      oldScript.parentNode.replaceChild(newScript, oldScript);
    });
  }catch(e){
    errEl.textContent = 'Mot de passe incorrect.';
    btn.disabled = false; btn.textContent = 'D\u00e9verrouiller';
  }
}

document.getElementById('pwd-input').addEventListener('keydown', e=>{ if(e.key==='Enter') tryUnlock(); });

// Auto-déverrouillage si un mot de passe est déjà en session (venant du TDB ou d'un autre fichier EPME)
(function autoUnlock(){
  let saved;
  try { saved = sessionStorage.getItem('epme_pwd'); } catch(e) { saved = null; }
  if (saved) {
    document.getElementById('pwd-input').value = saved;
    tryUnlock();
  }
})();
</script>
