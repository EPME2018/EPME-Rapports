<!DOCTYPE html>
<!-- EPME Collection - Rapport d'expertise véhicules de collection - v1 (verrou mot de passe) -->
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPME Collection – Rapport d'expertise</title>
<style>
  :root{
    --bordeaux:#6E1423; --bordeaux-dk:#4A0E18; --cream:#F7F1E3; --parchment:#EFE6D2;
    --gold:#B08D57; --gold-lt:#D9C08A; --ink:#2B211A;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:Georgia,'Times New Roman',serif;background:var(--parchment);color:var(--ink);}
  #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .login-box{
    background:#FFFDF8;border:1px solid #D9CBB0;border-radius:3px;padding:40px 36px;width:340px;
    box-shadow:0 8px 30px rgba(0,0,0,.15);text-align:center;
  }
  .login-lock-icon{font-size:28px;color:var(--bordeaux);margin-bottom:14px;}
  .login-box h1{font-size:20px;font-weight:400;color:var(--bordeaux);letter-spacing:.5px;margin-bottom:4px;}
  .login-box h1 span{font-style:italic;color:var(--gold);}
  .login-box p{font-size:12.5px;color:#7A6F63;margin-bottom:20px;}
  #pwd-input{
    width:100%;padding:10px 12px;border:1px solid #D9CBB0;border-radius:2px;font-family:Georgia,serif;
    font-size:14px;margin-bottom:14px;background:#fff;
  }
  #unlock-btn{
    width:100%;padding:10px 12px;background:var(--bordeaux);color:var(--cream);border:none;border-radius:2px;
    font-family:Georgia,serif;font-size:14px;font-weight:700;letter-spacing:.4px;cursor:pointer;
  }
  #unlock-btn:hover{background:var(--bordeaux-dk);}
  #unlock-btn:disabled{opacity:.6;cursor:default;}
  .login-error-msg{color:#A32D2D;font-size:12px;margin-top:12px;min-height:16px;}
  #app-root{display:none;}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="login-lock-icon">&#128274;</div>
    <h1>EPME <span>Collection</span></h1>
    <p>Rapport d'expertise — véhicules de collection<br>Accès protégé, saisissez le mot de passe</p>
    <input type="password" id="pwd-input" placeholder="Mot de passe" autofocus>
    <button id="unlock-btn" onclick="tryUnlock()">D&eacute;verrouiller</button>
    <div class="login-error-msg" id="login-error"></div>
  </div>
</div>

<div id="app-root"></div>

function b64ToBytes(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return bytes;
}

async function deriveKey(password, saltBytes, iterations){
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey('raw', enc.encode(password), {name:'PBKDF2'}, false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt: saltBytes, iterations: iterations, hash:'SHA-256'},
    baseKey,
    {name:'AES-GCM', length:256},
    false,
    ['decrypt']
  );
}

async function tryUnlock(){
  const pwd = document.getElementById('pwd-input').value;
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('unlock-btn');
  errEl.textContent = '';
  if(!pwd){ errEl.textContent='Mot de passe requis.'; return; }
  btn.disabled = true; btn.textContent = 'V\u00e9rification\u2026';
  try{
    const saltBytes = b64ToBytes(ENC_SALT);
    const ivBytes = b64ToBytes(ENC_IV);
    const dataBytes = b64ToBytes(ENC_DATA);
    const key = await deriveKey(pwd, saltBytes, ENC_ITER);
    const decrypted = await crypto.subtle.decrypt({name:'AES-GCM', iv: ivBytes}, key, dataBytes);
    const html = new TextDecoder().decode(decrypted);

    document.getElementById('app-root').innerHTML = html;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app-root').style.display = 'block';
    try { sessionStorage.setItem('epme_pwd', pwd); } catch(e) {}

    const scripts = document.getElementById('app-root').querySelectorAll('script');
    scripts.forEach(oldScript => {
      const newScript = document.createElement('script');
      newScript.textContent = oldScript.textContent;
      oldScript.parentNode.replaceChild(newScript, oldScript);
    });
  }catch(e){
    errEl.textContent = 'Mot de passe incorrect.';
    btn.disabled = false; btn.textContent = 'D\u00e9verrouiller';
  }
}

document.getElementById('pwd-input').addEventListener('keydown', e=>{ if(e.key==='Enter') tryUnlock(); });
