<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPME — Gestionnaire de dossiers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#F7F7F5;color:#1A1A18;min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-box{background:#fff;border:1px solid #DDDDD8;border-radius:10px;padding:40px;width:340px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.login-box h1{font-size:18px;font-weight:600;margin-bottom:6px;text-align:center}
.login-box h1 span{color:#185FA5}
.login-box p{font-size:13px;color:#8A8A84;text-align:center;margin-bottom:24px}
.login-box input{width:100%;padding:10px 12px;border:1px solid #DDDDD8;border-radius:6px;font-size:14px;margin-bottom:12px;font-family:inherit}
.login-box input:focus{outline:none;border-color:#185FA5}
.login-box button{width:100%;padding:10px;background:#185FA5;color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit}
.login-box button:hover{background:#0C447C}
.login-box button:disabled{opacity:.6;cursor:default}
.error-msg{color:#A32D2D;font-size:12px;text-align:center;margin-top:10px;min-height:16px}
.lock-icon{text-align:center;font-size:28px;color:#185FA5;margin-bottom:12px}
#app-root{display:none}
:root{
  --bg:#F7F7F5;--bg2:#EFEFEC;--bg3:#E6E6E1;
  --text:#1A1A18;--text2:#5A5A55;--text3:#8A8A84;
  --border:#DDDDD8;--border2:#CACAC4;
  --blue:#185FA5;--blue-bg:#E6F1FB;--blue-text:#0C447C;
  --amber:#BA7517;--amber-bg:#FAEEDA;
  --green:#3B6D11;--green-bg:#EAF3DE;
  --red:#A32D2D;--red-bg:#FCEBEB;
  --purple:#3C3489;--purple-bg:#EEEDFE;
  --orange:#712B13;--orange-bg:#FAECE7;
  --radius:8px;--radius-sm:5px;
  --font:'Segoe UI',system-ui,sans-serif;
  --courrier:'Montserrat',sans-serif;
}
#app-root{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
.app{max-width:1200px;margin:0 auto;padding:0 16px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border);margin-bottom:20px}
.logo{font-size:18px;font-weight:600;letter-spacing:-.3px}.logo span{color:var(--blue)}
.nav{display:flex;gap:4px}
.nav button{background:transparent;border:none;padding:7px 13px;border-radius:var(--radius-sm);font-size:13px;cursor:pointer;color:var(--text2);font-family:var(--font);display:flex;align-items:center;gap:5px}
.nav button.active{background:var(--bg2);color:var(--text);font-weight:500}
.nav button:hover:not(.active){background:var(--bg2)}
.grid-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.kpi-label{font-size:12px;color:var(--text3);margin-bottom:6px;display:flex;align-items:center;gap:5px}
.kpi-val{font-size:24px;font-weight:600}
.kpi-val.blue{color:var(--blue)}.kpi-val.amber{color:var(--amber)}.kpi-val.green{color:var(--green)}.kpi-val.red{color:var(--red)}
.section-title{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:10px;text-transform:uppercase;letter-spacing:.4px}
.pipeline{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:24px}
.pipe-col{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:10px}
.pipe-head{font-size:11px;font-weight:600;color:var(--text2);margin-bottom:8px;display:flex;align-items:center;gap:4px}
.pipe-head .count{margin-left:auto;font-size:14px;font-weight:700;color:var(--text)}
.pipe-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 8px;margin-bottom:5px;cursor:pointer;font-size:11px}
.pipe-card:hover{background:var(--bg2);border-color:var(--border2)}
.pipe-ref{font-weight:600;color:var(--text)}
.pipe-veh{color:var(--text3);margin-top:1px}
.pipe-mandant{color:var(--blue);font-weight:600;margin-top:2px;display:flex;align-items:center;gap:3px}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
th{text-align:left;padding:9px 12px;color:var(--text2);font-weight:500;background:var(--bg);border-bottom:1px solid var(--border);font-size:12px}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg)}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.badge.devis{background:var(--purple-bg);color:var(--purple)}
.badge.attente-reglement{background:var(--amber-bg);color:var(--amber)}
.badge.prep-dossier{background:var(--blue-bg);color:var(--blue-text)}
.badge.expertise-avenir{background:var(--orange-bg);color:var(--orange)}
.badge.deposer-rapport{background:var(--red-bg);color:var(--red)}
.badge.cloture{background:var(--green-bg);color:var(--green)}
.badge.urgent{background:var(--red-bg);color:var(--red);border:1px solid #F09595}
.toolbar{display:flex;gap:8px;margin-bottom:14px;align-items:center}
.toolbar input,.toolbar select{font-size:13px;padding:7px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:#fff;color:var(--text);font-family:var(--font);height:34px}
.toolbar input{flex:1}
.btn{background:#fff;border:1px solid var(--border);padding:6px 14px;border-radius:var(--radius-sm);font-size:13px;cursor:pointer;color:var(--text);font-family:var(--font);display:inline-flex;align-items:center;gap:5px;height:34px;white-space:nowrap}
.btn:hover{background:var(--bg2)}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.primary:hover{background:var(--blue-text)}
.btn.success{background:var(--green);color:#fff;border-color:var(--green)}.btn.success:hover{background:#27500A}
.btn.danger{color:var(--red);border-color:var(--red)}.btn.danger:hover{background:var(--red-bg)}
.empty{text-align:center;padding:40px;color:var(--text3);font-size:13px;background:#fff;border:1px solid var(--border);border-radius:var(--radius)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding-top:40px;z-index:100}
.modal{background:#fff;border-radius:var(--radius);border:1px solid var(--border);padding:24px;width:580px;max-height:85vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.18)}
.modal.wide{width:660px}
.modal h2{font-size:16px;font-weight:600;margin-bottom:18px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.form-row.full{grid-template-columns:1fr}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group label{font-size:12px;color:var(--text2);font-weight:500}
.form-group input,.form-group select,.form-group textarea{font-size:13px;padding:7px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:#fff;color:var(--text);font-family:var(--font)}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--blue)}
.form-group textarea{resize:vertical;min-height:60px}
.hint{font-size:11px;color:var(--text3);margin-top:2px}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;border-top:1px solid var(--border);padding-top:14px}
.detail-row{display:flex;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.detail-row:last-of-type{border-bottom:none}
.detail-row .lbl{color:var(--text2);width:160px;flex-shrink:0;font-weight:500}
.wf-bar{display:flex;align-items:center;margin-bottom:16px}
.wf-step{display:flex;align-items:center;flex:1;min-width:0}
.wf-node{flex:1;text-align:center;padding:7px 4px;font-size:10px;font-weight:600;border-radius:var(--radius-sm);min-width:0;border:1px solid transparent}
.wf-node.done{background:var(--green-bg);color:var(--green);border-color:#C3E0A0}
.wf-node.active{background:var(--blue-bg);color:var(--blue-text);border-color:#B5D4F4;box-shadow:0 0 0 2px var(--blue)}
.wf-node.todo{background:var(--bg2);color:var(--text3)}
.wf-arrow{color:var(--text3);font-size:12px;flex-shrink:0;margin:0 2px}
.pv-banner{background:var(--blue-bg);border:1px solid #B5D4F4;border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;font-size:13px;color:var(--blue-text);display:flex;align-items:center;gap:8px}
.pv-banner.warn{background:var(--amber-bg);border-color:#FAC775;color:var(--amber)}
.pv-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.pv-box{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px}
.pv-box-title{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.4px}
.pv-row{display:flex;gap:8px;margin-bottom:4px;font-size:12px}
.pv-row .pk{color:var(--text3);width:90px;flex-shrink:0}
.pv-row .pv{font-weight:600}
.courrier-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;cursor:pointer}
.courrier-card:hover{border-color:var(--border2);background:var(--bg)}
.courrier-card h4{font-size:13px;font-weight:600;margin-bottom:3px;display:flex;align-items:center;gap:6px}
.courrier-card p{font-size:12px;color:var(--text3)}
.tag-pv{display:inline-flex;align-items:center;gap:3px;font-size:10px;padding:1px 6px;border-radius:999px;background:var(--blue-bg);color:var(--blue);font-weight:600;margin-left:4px}
.info-box{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;font-size:12px;color:var(--text2);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.sep{border-top:1px solid var(--border);margin:16px 0 12px}
.actions-col{display:flex;gap:4px}
.courrier-render{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:24px 28px;font-family:var(--courrier);font-size:12px;line-height:1.8;color:#111}
.courrier-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
.courrier-exp{white-space:pre;font-size:11px;color:#444;line-height:1.6}
.courrier-dest{text-align:right;font-size:12px;color:#111;line-height:1.6}
.courrier-dest[contenteditable]{outline:none;border-bottom:1px dashed #ccc;padding-bottom:2px;min-width:180px}
.courrier-dest[contenteditable]:focus{border-bottom-color:var(--blue)}
.courrier-body{width:100%;min-height:280px;font-size:12px;font-family:var(--courrier);line-height:1.8;border:none;outline:none;resize:vertical;background:transparent;color:#111}
.partie-bloc{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-bottom:8px}

</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="lock-icon"><i class="ti ti-lock"></i></div>
    <h1>EPME <span>Expertise</span></h1>
    <p>Accès protégé — saisissez le mot de passe</p>
    <input type="password" id="pwd-input" placeholder="Mot de passe" autofocus>
    <button id="unlock-btn" onclick="tryUnlock()">Déverrouiller</button>
    <div class="error-msg" id="login-error"></div>
  </div>
</div>

<div id="app-root"></div>

function b64ToBytes(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return bytes;
}

async function deriveKey(password, saltBytes, iterations){
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey('raw', enc.encode(password), {name:'PBKDF2'}, false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt: saltBytes, iterations: iterations, hash:'SHA-256'},
    baseKey,
    {name:'AES-GCM', length:256},
    false,
    ['decrypt']
  );
}

async function tryUnlock(){
  const pwd = document.getElementById('pwd-input').value;
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('unlock-btn');
  errEl.textContent = '';
  if(!pwd){ errEl.textContent='Mot de passe requis.'; return; }
  btn.disabled = true; btn.textContent = 'Vérification…';
  try{
    const saltBytes = b64ToBytes(ENC_SALT);
    const ivBytes = b64ToBytes(ENC_IV);
    const dataBytes = b64ToBytes(ENC_DATA);
    const key = await deriveKey(pwd, saltBytes, ENC_ITER);
    const decrypted = await crypto.subtle.decrypt({name:'AES-GCM', iv: ivBytes}, key, dataBytes);
    const html = new TextDecoder().decode(decrypted);

    document.getElementById('app-root').innerHTML = html;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app-root').style.display = 'block';

    // Exécuter les scripts injectés (innerHTML n'exécute pas les <script> automatiquement)
    const scripts = document.getElementById('app-root').querySelectorAll('script');
    scripts.forEach(oldScript => {
      const newScript = document.createElement('script');
      newScript.textContent = oldScript.textContent;
      oldScript.parentNode.replaceChild(newScript, oldScript);
    });
  }catch(e){
    errEl.textContent = 'Mot de passe incorrect.';
    btn.disabled = false; btn.textContent = 'Déverrouiller';
  }
}

document.getElementById('pwd-input').addEventListener('keydown', e=>{ if(e.key==='Enter') tryUnlock(); });
</script>
</body>
